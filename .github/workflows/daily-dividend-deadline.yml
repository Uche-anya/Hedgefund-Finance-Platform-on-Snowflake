name: Check daily dividend deadline

on:
  schedule:
    - cron: '35 5 * * TUE-SAT'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      business_date:
        description: US market date (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule' || vars.NORTHBRIDGE_DIVIDENDS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: NORTHBRIDGE_LOADER
      SNOWFLAKE_ROLE: NORTHBRIDGE_INGEST_DEV
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.NORTHBRIDGE_LOADER_KEY_B64 }}
      REQUESTED_DATE: ${{ inputs.business_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Write the loader key
        env:
          SNOWFLAKE_PRIVATE_KEY_FILE: ${{ runner.temp }}/northbridge_loader.p8
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          value = os.environ['SNOWFLAKE_PRIVATE_KEY_B64']
          path = Path(os.environ['SNOWFLAKE_PRIVATE_KEY_FILE'])
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Check the dividend delivery
        env:
          SNOWFLAKE_PRIVATE_KEY_FILE: ${{ runner.temp }}/northbridge_loader.p8
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            python -m pipeline.check_dividend_deadline --business-date "$REQUESTED_DATE"
          else
            python -m pipeline.check_dividend_deadline
          fi
