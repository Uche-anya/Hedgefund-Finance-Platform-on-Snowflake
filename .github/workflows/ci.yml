name: Pull request checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dbt.txt
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Parse dbt project without a Snowflake connection
        run: dbt parse --project-dir dbt --profiles-dir .github/dbt_ci --no-partial-parse
