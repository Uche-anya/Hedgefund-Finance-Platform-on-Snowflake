name: Pull request checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dbt.txt
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Parse each dbt target without a Snowflake connection
        run: |
          for target in dev test prod; do
            dbt parse --project-dir dbt --profiles-dir .github/dbt_ci --target "$target" --no-partial-parse
            TARGET="$target" python - <<'PY'
          import json
          import os

          with open('dbt/target/manifest.json') as file:
              manifest = json.load(file)
          expected = 'NORTHBRIDGE_' + os.environ['TARGET'].upper()
          databases = {source['database'] for source in manifest['sources'].values()}
          if databases != {expected}:
              raise SystemExit('RAW sources for {} point at {}'.format(expected, databases))
          PY
          done

  integration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    environment: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NORTHBRIDGE_DBT_USER: NORTHBRIDGE_CI_TEST
      NORTHBRIDGE_DBT_KEY_PATH: /tmp/northbridge_ci_test.p8
      TEST_KEY_B64: ${{ secrets.NORTHBRIDGE_CI_TEST_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dbt.txt
      - name: Select the TEST case
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' config/ci_test_fixture.json >> "$GITHUB_ENV"
      - name: Write TEST key
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          value = os.environ.get('TEST_KEY_B64')
          if not value:
              raise SystemExit('CI TEST key is missing')
          path = Path(os.environ['NORTHBRIDGE_DBT_KEY_PATH'])
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Build against TEST inputs
        run: dbt build --project-dir dbt --profiles-dir dbt --target test --no-partial-parse
