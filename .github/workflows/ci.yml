name: Code checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt dbt-core==1.12.2 dbt-snowflake==1.12.1
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Parse dbt project
        env:
          NORTHBRIDGE_DBT_KEY_PATH: unused-in-parse
          DBT_BUSINESS_DATE: '2026-10-15'
          DBT_OPENING_DATE: '2026-10-07'
          DBT_SCENARIO_ID: sim-close-20261008
        run: dbt parse --project-dir dbt --profiles-dir dbt --no-partial-parse
