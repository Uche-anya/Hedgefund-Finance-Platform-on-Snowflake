name: Daily dividend delivery

on:
  schedule:
    - cron: '25 0,1 * * TUE-SAT'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      business_date:
        description: US market date (YYYY-MM-DD)
        required: true
        type: string
      submit:
        description: Send the snapshot to Snowflake
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-dividends-${{ github.event.inputs.business_date || 'scheduled' }}
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name != 'schedule' || vars.NORTHBRIDGE_DIVIDENDS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: NORTHBRIDGE_LOADER
      SNOWFLAKE_ROLE: NORTHBRIDGE_INGEST_DEV
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.NORTHBRIDGE_LOADER_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Pick the close date
        id: day
        env:
          REQUESTED_DATE: ${{ inputs.business_date }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python -m pipeline.schedule_day >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "business_date=$REQUESTED_DATE" >> "$GITHUB_OUTPUT"
          fi
      - name: Check connection settings
        if: steps.day.outputs.run == 'true'
        run: |
          for name in MASSIVE_API_KEY SNOWFLAKE_ACCOUNT SNOWFLAKE_PRIVATE_KEY_B64; do
            if [ -z "${!name}" ]; then
              echo "Missing $name" >&2
              exit 1
            fi
          done
      - if: steps.day.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Write the loader key
        if: steps.day.outputs.run == 'true'
        env:
          SNOWFLAKE_PRIVATE_KEY_FILE: ${{ runner.temp }}/northbridge_loader.p8
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          value = os.environ['SNOWFLAKE_PRIVATE_KEY_B64']
          path = Path(os.environ['SNOWFLAKE_PRIVATE_KEY_FILE'])
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Fetch and load dividends
        if: steps.day.outputs.run == 'true'
        env:
          REQUESTED_DATE: ${{ steps.day.outputs.business_date }}
          SUBMIT: ${{ github.event_name == 'schedule' || inputs.submit }}
          SNOWFLAKE_PRIVATE_KEY_FILE: ${{ runner.temp }}/northbridge_loader.p8
        run: |
          if [ "$SUBMIT" = true ]; then
            python -m pipeline.produce_dividends "$REQUESTED_DATE" --submit
          else
            python -m pipeline.produce_dividends "$REQUESTED_DATE"
          fi
