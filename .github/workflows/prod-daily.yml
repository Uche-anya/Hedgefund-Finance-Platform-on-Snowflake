name: PROD daily close

on:
  schedule:
    - cron: '0 7,8,9 * * 2-6'
    - cron: '0 13 * * 2-6'
  workflow_dispatch:
    inputs:
      business_date:
        description: US market date (YYYY-MM-DD); blank means yesterday UTC
        required: false
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: prod-daily-deliveries
  cancel-in-progress: false

jobs:
  deliver:
    if: vars.NORTHBRIDGE_PROD_DAILY_ENABLED == 'true'
    environment: production-data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      NORTHBRIDGE_ENV: prod
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: NORTHBRIDGE_INGEST_PROD
      SNOWFLAKE_ROLE: NORTHBRIDGE_INGEST_PROD
      SNOWFLAKE_PRIVATE_KEY_FILE: /tmp/northbridge_ingest_prod.p8
      LOADER_KEY_B64: ${{ secrets.NORTHBRIDGE_INGEST_PROD_KEY_B64 }}
      REQUESTED_DATE: ${{ inputs.business_date }}
    steps:
      - name: Select the last successful PROD release
        id: release
        run: |
          deployments=$(gh api -X GET \
            "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=100")
          found=false
          while IFS=$'\t' read -r id sha; do
            state=$(gh api -X GET \
              "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state')
            if [ "$state" = success ]; then
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              found=true
              break
            fi
          done < <(echo "$deployments" | jq -r '.[] | [.id, .sha] | @tsv')
          if [ "$found" != true ]; then
            echo 'No successful PROD code release; daily delivery stopped.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Write loader key
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          value = os.environ.get('LOADER_KEY_B64')
          if not value:
              raise SystemExit('PROD loader key is missing')
          path = Path(os.environ['SNOWFLAKE_PRIVATE_KEY_FILE'])
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Deliver market and fund inputs
        if: github.event.schedule != '0 13 * * 2-6'
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            python -m scripts.run_prod_day --business-date "$REQUESTED_DATE"
          else
            python -m scripts.run_prod_day
          fi
      - name: Check the close deadline
        if: github.event.schedule == '0 13 * * 2-6'
        run: python -m pipeline.check_close_deadline --scenario sim-prod-20261016
