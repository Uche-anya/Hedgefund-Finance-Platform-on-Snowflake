name: Daily market and fund deliveries

on:
  workflow_dispatch:
    inputs:
      business_date:
        description: US market date (YYYY-MM-DD)
        required: true
        type: string
  schedule:
    - cron: '0 1 * * 2-6'

permissions:
  contents: read

concurrency:
  group: daily-producer-${{ github.event.inputs.business_date || 'scheduled' }}
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: NORTHBRIDGE_LOADER
      SNOWFLAKE_ROLE: NORTHBRIDGE_INGEST_DEV
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.NORTHBRIDGE_LOADER_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_FILE: ${{ runner.temp }}/northbridge_loader.p8
    steps:
      - name: Check connection settings
        run: |
          for name in MASSIVE_API_KEY SNOWFLAKE_ACCOUNT SNOWFLAKE_PRIVATE_KEY_B64; do
            if [ -z "${!name}" ]; then
              echo "Missing $name" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Write the loader key
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          value = os.environ.get('SNOWFLAKE_PRIVATE_KEY_B64')
          if not value:
              raise SystemExit('NORTHBRIDGE_LOADER_KEY_B64 is missing')
          path = Path(os.environ['SNOWFLAKE_PRIVATE_KEY_FILE'])
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Deliver the market day
        env:
          REQUESTED_DATE: ${{ github.event.inputs.business_date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            day="$REQUESTED_DATE"
          else
            day="$(date -u -d yesterday +%F)"
          fi
          python -m pipeline.produce_day "$day" --submit
