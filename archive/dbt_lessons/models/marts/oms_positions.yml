version: 2
models:
  - name: oms_first_day_positions
    description: Account positions for the fixed January 6 simulation, with explicitly zero opening holdings. Negative quantities are shorts. Not settled balances or a multi-day position ledger.
    columns:
      - name: scenario_id
        data_tests: [not_null]
      - name: business_date
        data_tests: [not_null]
      - name: fund_id
        data_tests: [not_null]
      - name: account_id
        data_tests: [not_null]
      - name: instrument_id
        data_tests: [not_null]
      - name: market_ticker
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: opening_quantity
        data_tests: [not_null]
      - name: net_trade_quantity
        data_tests: [not_null]
      - name: closing_quantity
        data_tests: [not_null]
