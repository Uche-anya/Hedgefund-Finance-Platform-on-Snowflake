      - name: historical_prices
        identifier: HISTORICAL_PRICES
        description: Assembled Massive daily bars with reviewed repairs and load provenance.
      - name: closing_prices
        identifier: CLOSING_PRICES
        description: Saved EODHD closing prices with file and delivery metadata.
      - name: executions
        identifier: EXECUTIONS
        description: Received simulated execution records, including delivery metadata.
      - name: allocations
        identifier: ALLOCATIONS
        description: Received simulated portfolio allocations, including delivery metadata.
