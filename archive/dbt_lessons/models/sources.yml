version: 2
sources:
  - name: raw
    database: NORTHBRIDGE_DEV
    schema: RAW
    tables:
      - name: corporate_actions
        identifier: CORPORATE_ACTIONS
      - name: corporate_action_reviews
        identifier: CORPORATE_ACTION_REVIEWS
      - name: replay_inputs
        identifier: REPLAY_INPUTS
        description: Labeled multi-day simulation records, separated from the original five-trade lesson.
      - name: settlement_events
        identifier: SETTLEMENT_EVENTS
        description: Saved fictional custodian confirmations, including original JSON and load metadata.
      - name: oms_events
        identifier: OMS_EVENTS
