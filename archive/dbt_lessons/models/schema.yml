version: 2
models:
  - name: portfolio_valuation
    description: First-day signed position values in USD; excludes cash and obligations, so this is not NAV.
    columns:
      - name: valuation_date
        data_tests: [not_null]
      - name: portfolio
        data_tests: [not_null]
      - name: instrument
        data_tests: [not_null]
      - name: quantity
        data_tests: [not_null]
      - name: close_price
        data_tests: [not_null]
      - name: market_value
        data_tests: [not_null]
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD']
  - name: stg_closing_prices
    description: One USD unadjusted closing price per instrument and date in the selected price delivery.
    columns:
      - name: valuation_date
        data_tests: [not_null]
      - name: instrument
        data_tests: [not_null]
      - name: close_price
        data_tests: [not_null]
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD']
      - name: price_basis
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['unadjusted']
  - name: stg_executions
    description: One execution per ID for the selected simulated OMS delivery.
    columns:
      - name: execution_id
        data_tests: [not_null, unique]
      - name: business_date
        data_tests: [not_null]
      - name: instrument
        data_tests: [not_null]
      - name: side
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: quantity
        data_tests: [not_null]
  - name: stg_allocations
    description: One allocation per ID for the same selected delivery.
    columns:
      - name: allocation_id
        data_tests: [not_null, unique]
      - name: execution_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_executions')
                field: execution_id
      - name: business_date
        data_tests: [not_null]
      - name: portfolio
        data_tests: [not_null]
      - name: quantity
        data_tests: [not_null]
  - name: portfolio_holdings
    description: First-day portfolio holdings from zero opening positions; not approved reporting.
    columns:
      - name: quantity
        data_tests: [not_null]
