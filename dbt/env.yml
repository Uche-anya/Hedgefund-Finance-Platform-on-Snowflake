env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        DBT_DATABASE: NORTHBRIDGE_DEV
        DBT_SOURCE_DATABASE: NORTHBRIDGE_DEV
        DBT_CURRENT_ROLE: NORTHBRIDGE_DBT_DEV
        DBT_CURRENT_WAREHOUSE: COMPUTE_WH
    - name: ci
      env:
        DBT_DATABASE: NORTHBRIDGE_CI_BASE
        DBT_SOURCE_DATABASE: NORTHBRIDGE_CI_BASE
        DBT_CURRENT_ROLE: NORTHBRIDGE_DBT_CI
        DBT_CURRENT_WAREHOUSE: NORTHBRIDGE_CI_WH
    - name: prod
      env:
        DBT_DATABASE: NORTHBRIDGE_PROD
        DBT_SOURCE_DATABASE: NORTHBRIDGE_PROD
        DBT_CURRENT_ROLE: NORTHBRIDGE_DBT_PROD
        DBT_CURRENT_WAREHOUSE: NORTHBRIDGE_PROD_WH
