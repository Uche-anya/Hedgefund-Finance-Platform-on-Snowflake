northbridge:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: not_needed
      user: not_needed
      role: "{{ env_var('DBT_CURRENT_ROLE', 'NORTHBRIDGE_DBT_DEV') }}"
      database: "{{ env_var('DBT_DATABASE', 'NORTHBRIDGE_DEV') }}"
      schema: DBT_DEV
      warehouse: "{{ env_var('DBT_CURRENT_WAREHOUSE', 'COMPUTE_WH') }}"
      threads: 4
    ci:
      type: snowflake
      account: not_needed
      user: not_needed
      role: "{{ env_var('DBT_CURRENT_ROLE', 'NORTHBRIDGE_DBT_CI') }}"
      database: "{{ env_var('DBT_DATABASE', 'NORTHBRIDGE_CI_BASE') }}"
      schema: DBT_CI
      warehouse: "{{ env_var('DBT_CURRENT_WAREHOUSE', 'NORTHBRIDGE_CI_WH') }}"
      threads: 4
    prod:
      type: snowflake
      account: not_needed
      user: not_needed
      role: "{{ env_var('DBT_CURRENT_ROLE', 'NORTHBRIDGE_DBT_PROD') }}"
      database: "{{ env_var('DBT_DATABASE', 'NORTHBRIDGE_PROD') }}"
      schema: DBT_PROD
      warehouse: "{{ env_var('DBT_CURRENT_WAREHOUSE', 'NORTHBRIDGE_PROD_WH') }}"
      threads: 4
