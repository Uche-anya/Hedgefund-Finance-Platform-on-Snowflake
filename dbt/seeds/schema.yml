version: 2

seeds:
  - name: dim_instrument
    description: Effective-dated instrument identities. A security keeps its security ID when an attribute such as its ticker changes; each dated version has its own version ID.
    columns:
      - name: instrument_version_id
        description: Unique identifier for one effective-dated version of a security.
        data_tests: [unique, not_null]
      - name: security_id
        description: Stable Northbridge identifier shared by every version of the same security.
        data_tests: [not_null]
      - name: share_class_figi
        description: Provider identifier used to connect mastered securities to market data.
        data_tests: [not_null]
  - name: approved_corporate_actions
    description: Corporate actions approved for portfolio accounting after operations review.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: reviewed_record_date
        data_tests: [not_null]
      - name: review_id
        data_tests: [not_null]
