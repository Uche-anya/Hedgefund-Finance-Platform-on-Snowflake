version: 2

models:
  - name: stg_oms_events
    description: Typed execution reports from the dedicated OMS landing table.
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: execution_id
        data_tests: [not_null]
  - name: stg_settlement_events
    description: Typed custodian settlement confirmations from their own landing table.
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: execution_id
        data_tests: [not_null]
